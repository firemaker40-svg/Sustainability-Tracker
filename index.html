<style>
:root{
  color-scheme:dark;
  --bg:#0a0d0b; --card:#101411; --raise:#161b17; --text:#e7ece8; --muted:#7f8d85; --border:#1e2822;
  --accent:#3ddc84; --accent-ink:#04120a; --accent-soft:rgba(61,220,132,.12);
  --warn:#e2b555; --warn-soft:rgba(226,181,85,.12);
  --danger:#f0605d; --danger-soft:rgba(240,96,93,.12);
  --ok:#3ddc84; --ok-soft:rgba(61,220,132,.12);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1120px;margin:0 auto;padding:36px 20px 90px;}
h1{font-size:1.25rem;font-weight:600;letter-spacing:-0.01em;margin:0 0 6px;display:flex;align-items:center;gap:10px;}
h1::before,.login-box h2::before{content:"";width:10px;height:10px;background:var(--accent);border-radius:2px;display:inline-block;flex:none;}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:28px;}
.topbar .sub{margin:0;}
.session{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.session button{padding:7px 14px;}
.sub{color:var(--muted);font-size:0.82rem;margin:0 0 28px;}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:30px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px 18px;}
.card .n{font-size:1.9rem;font-weight:600;letter-spacing:-0.02em;line-height:1.1;font-variant-numeric:tabular-nums;}
.card .l{color:var(--muted);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.07em;margin-top:8px;}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;padding-bottom:20px;border-bottom:1px solid var(--border);align-items:center;}
.spacer{flex:1;}
.sync-status{font-size:0.75rem;color:var(--muted);white-space:nowrap;}
select,input,button,textarea{font-family:inherit;font-size:0.82rem;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);padding:8px 12px;transition:border-color .15s,background .15s,color .15s,box-shadow .15s;}
select:hover,input:hover{border-color:#2d3b33;}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
button{cursor:pointer;}
button:hover{border-color:var(--accent);color:var(--accent);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
.btn-primary:hover{color:var(--accent-ink);filter:brightness(1.1);}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600;}
.btn-danger:hover{color:#fff;border-color:var(--danger);filter:brightness(1.1);}

.group{margin-bottom:30px;}
.group h2{font-size:0.95rem;font-weight:600;margin:0 0 12px;color:var(--text);display:flex;align-items:center;gap:6px;cursor:grab;user-select:none;}
.group h2.cat-dragging{opacity:0.4;}
.group h2 .drag-handle{width:auto;}
.cat-toggle{display:inline-block;width:14px;text-align:center;cursor:pointer;color:var(--accent);}
.tbl-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:var(--card);}
table{width:100%;border-collapse:collapse;min-width:640px;}
th{text-align:left;padding:11px 14px;font-size:0.68rem;font-weight:500;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;}
td{text-align:left;padding:12px 14px;font-size:0.82rem;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody tr:hover td{background:var(--raise);}
td:nth-child(2),td:nth-child(3),td:nth-child(4){white-space:normal;}
td:nth-child(2){min-width:190px;}
td:nth-child(3){min-width:150px;}
.badge{white-space:nowrap;}
.note{margin-top:4px;padding-left:8px;border-left:2px solid var(--accent);color:var(--muted);font-size:0.74rem;white-space:pre-wrap;max-width:340px;line-height:1.4;}
.toolbar select{max-width:210px;}
tr:last-child td{border-bottom:none;}
tr.row-dragging{opacity:0.35;}

.badge{display:inline-block;padding:3px 9px;border-radius:4px;font-size:0.72rem;font-weight:500;}
.b-ok{background:var(--ok-soft);color:var(--ok);}
.b-warn{background:var(--warn-soft);color:var(--warn);}
.b-danger{background:var(--danger-soft);color:var(--danger);}
.b-muted{background:rgba(255,255,255,0.06);color:var(--muted);}
.cell-note{color:var(--muted);font-size:0.8rem;white-space:pre-wrap;min-width:180px;max-width:340px;line-height:1.4;}

.icon-btn{border:none;background:none;color:var(--muted);cursor:pointer;font-size:0.95rem;padding:4px 7px;border-radius:4px;}
.icon-btn:hover{color:var(--accent);background:var(--accent-soft);border:none;}
.icon-btn[title="Hapus"]:hover{color:var(--danger);background:var(--danger-soft);}
.icon-btn:disabled{opacity:0.25;cursor:not-allowed;}
.drag-handle{cursor:grab;color:var(--muted);text-align:center;user-select:none;width:24px;}
.drag-handle.disabled{opacity:0.3;cursor:not-allowed;}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:10;padding:16px;}
.modal-bg.open{display:flex;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:24px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,0.55);}
.modal h3{margin:0 0 18px;font-size:1rem;font-weight:600;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;background:var(--bg);}
.field textarea{resize:vertical;min-height:70px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}
.empty{text-align:center;color:var(--muted);padding:40px;font-size:0.85rem;}

.login-bg{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:32px 28px;width:100%;max-width:340px;}
.login-box h2{margin:0 0 6px;font-size:1.05rem;font-weight:600;display:flex;align-items:center;gap:10px;}
.login-box p{margin:0 0 22px;color:var(--muted);font-size:0.82rem;}
.login-box input{width:100%;margin-bottom:10px;padding:10px 12px;background:var(--bg);font-size:0.88rem;}
.login-box button{width:100%;padding:11px;margin-top:4px;}
#loginErr{color:var(--danger);font-size:0.8rem;margin-top:12px;min-height:1.2em;}
:root{--yellow:#facc15;--orange:#ff912d;}
body:not(.role-master) .col-edit{display:none;}
body.role-viewer .col-file{display:none;}
.b-yellow{background:rgba(250,204,21,.14);color:var(--yellow);}
.b-orange{background:rgba(255,145,45,.16);color:var(--orange);}
.b-info{background:rgba(96,165,250,.14);color:#60a5fa;}
.b-rev{background:rgba(192,132,252,.14);color:#c084fc;}
td.dl-yellow{color:var(--yellow);font-weight:600;}
td.dl-orange{color:var(--orange);font-weight:600;}
.note.rev{border-color:#c084fc;}
.frow{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:0.8rem;}
.frow a{color:var(--accent);text-decoration:none;word-break:break-all;}
.frow span{color:var(--muted);font-size:0.72rem;white-space:nowrap;margin-left:auto;}
.utbl{width:100%;min-width:0;margin-bottom:6px;}
.utbl td,.utbl th{padding:8px 6px;white-space:normal;}
</style>
</head>
<body>
<div class="login-bg" id="loginScreen">
  <div class="login-box">
    <h2>Pemantau Progres Tim Sustainability</h2>
    <p>Silakan masuk untuk melanjutkan.</p>
    <input id="loginEmail" type="text" placeholder="Username" autocomplete="username" autocapitalize="none" spellcheck="false">
    <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn-primary" id="loginBtn">Masuk</button>
    <div id="loginErr"></div>
  </div>
</div>
<div class="wrap" id="appWrap" style="display:none">
  <div class="topbar">
    <div>
      <h1>Pemantau Progres Tim Sustainability</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="session">
      <span id="userInfo" class="sync-status"></span>
      <span id="syncStatus" class="sync-status"></span>
      <button id="logoutBtn" class="btn-danger">Sign out</button>
    </div>
  </div>

  <div class="cards" id="cards">
  </div>

  <div class="toolbar">
    <select id="fCategory"><option value="">Semua Kategori</option></select>
    <select id="fRegion"><option value="">Semua Wilayah/Unit</option></select>
    <select id="fStatus">
      <option value="">Semua Status</option>
      <option value="Belum Mulai">Belum Mulai</option>
      <option value="Berjalan">Berjalan</option>
      <option value="Telah Dikirim">Telah Dikirim</option>
      <option value="Perlu Revisi">Perlu Revisi</option>
      <option value="Terlambat">Terlambat</option>
      <option value="Selesai">Selesai</option>
    </select>
    <select id="fSort">
      <option value="manual">Urutan: Manual (drag)</option>
      <option value="alpha">Urutan: Abjad (A-Z)</option>
      <option value="deadline">Urutan: Deadline Terdekat</option>
    </select>
    <div class="spacer"></div>
    <button id="usersBtn" style="display:none">Kelola Akun</button>
    <button class="btn-primary" id="addBtn">+ Tambah Pekerjaan</button>
  </div>

  <div id="groups"></div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Duplikat Pekerjaan (ubah Kategori &amp; Deadline)</h3>
    <div class="field"><label>Nama Pekerjaan</label><input id="fName" placeholder="mis. Audit Emisi Karbon"></div>
    <div class="field"><label>Kategori</label><input id="fCat" placeholder="mis. Audit Emisi"></div>
    <div class="field"><label>Wilayah / Unit</label><input id="fReg" placeholder="mis. Sumatra - Unit Produksi"></div>
    <div class="field"><label>Penanggung Jawab</label><input id="fPic" placeholder="Nama PIC"></div>
    <div class="field"><label>Deadline</label><input id="fDeadline" type="date"></div>
    <div class="field"><label>Status</label>
      <select id="fStat">
        <option>Belum Mulai</option><option>Berjalan</option><option>Telah Dikirim</option><option>Perlu Revisi</option><option>Terlambat</option><option>Selesai</option>
      </select>
    </div>
    <div class="field"><label>Keterangan / Komentar (opsional)</label><textarea id="fNotes" rows="3" placeholder="Catatan tambahan untuk pekerjaan ini..."></textarea></div>
    <div class="modal-actions">
      <button id="cancelBtn">Batal</button>
      <button class="btn-primary" id="saveBtn">Simpan</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="fileModalBg"><div class="modal" style="max-width:480px">
  <h3 id="fmTitle"></h3><p class="sub" id="fmInfo" style="margin-bottom:12px"></p>
  <div id="fmList"></div>
  <div class="field" id="fmUpload" style="margin-top:14px"><label>Unggah Lampiran (maks 25 MB per file)</label><input type="file" id="fmInput" multiple><button class="btn-primary" id="fmSend" style="margin-top:8px">Kirim untuk Review</button></div>
  <div class="field" id="fmReview" style="margin-top:14px"><label>Catatan Review (wajib jika dikembalikan)</label><textarea id="fmNote" rows="2"></textarea>
    <div class="modal-actions"><button id="fmRevise">↩ Kembalikan (Perlu Revisi)</button><button class="btn-primary" id="fmApprove">✔ Konfirmasi Selesai</button></div></div>
  <div class="modal-actions"><button id="fmClose">Tutup</button></div>
</div></div>

<div class="modal-bg" id="userModalBg"><div class="modal" style="max-width:560px">
  <h3>Kelola Akun</h3><div id="umList"></div>
  <h3 style="margin-top:20px;font-size:0.9rem">Buat Akun Baru</h3>
  <div class="field"><label>Username</label><input id="umUser" autocapitalize="none" placeholder="huruf kecil/angka, min. 3 karakter"></div>
  <div class="field"><label>Password (min. 8 karakter)</label><input id="umPass" type="text" autocomplete="off"></div>
  <div class="field"><label>Tier</label><select id="umRole"><option value="viewer">Viewer</option><option value="admin">Admin (per unit)</option><option value="master">Super Admin</option></select></div>
  <div class="field" id="umUnitWrap" style="display:none"><label>Unit Admin (hanya unit ini yang bisa diunggah)</label><select id="umUnit"></select></div>
  <div class="modal-actions"><button id="umClose">Tutup</button><button class="btn-primary" id="umCreate">Buat Akun</button></div>
</div></div>

<script>
const SEED = (function(){ try{ return JSON.parse(document.getElementById('seed-data').textContent); }catch(e){ return []; } })();
let tasks = [];
let userRole = null; // 'master' (Super Admin) | 'admin' | 'viewer'
let userUnit = null, currentEmail = '', taskFiles = {}, curFileTask = null;
const $ = id => document.getElementById(id);
function isSuper(){ return userRole==='master'; }
function canEdit(){ return isSuper(); }
function canSeeFiles(){ return userRole==='master' || userRole==='admin'; }
function canUpload(t){ return isSuper() || (userRole==='admin' && t.region===userUnit); }
let editingId = null;
let sb = null; // Supabase client; null = mode lokal saja (localStorage)

// ====== ISI DI SINI AGAR OTOMATIS TERSAMBUNG (tanpa klik tombol Sinkronisasi) ======
const DEFAULT_SB_URL = 'https://axqkwfblcwjifuxeugmf.supabase.co';  // contoh: 'https://abcdefgh.supabase.co'
const DEFAULT_SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4cWt3ZmJsY3dqaWZ1eGV1Z21mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1Mzk2NTcsImV4cCI6MjEwNjExNTY1N30.hcJwIn7Q8jomlXmu1k5Gcdy_LMVgMgpVTpM-vLni4bo';  // contoh: 'eyJhbGciOi...' (anon public key)
// =================================================================================
function getSbConfig(){
  try{
    const c = JSON.parse(localStorage.getItem('sustainability_sb_config')||'null');
    if(c && c.url && c.key) return c;
  }catch(e){}
  if(DEFAULT_SB_URL && DEFAULT_SB_KEY) return { url: DEFAULT_SB_URL, key: DEFAULT_SB_KEY };
  return null;
}
function setSyncStatus(text, color){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  el.textContent = text;
  el.style.color = color || '';
}
function toRow(t){
  return { id:t.id, name:t.name, category:t.category, region:t.region, pic:t.pic||'', deadline:t.deadline, status:t.status, sort_order:t.sort_order??0, ...(t.notes!==undefined ? { notes: t.notes||'' } : {}), ...(t.review_note!==undefined ? { review_note: t.review_note } : {}) };
}
function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

const LOGIN_DOMAIN = '@tracker-permata.com';
async function initSupabase(){
  const cfg = getSbConfig();
  if(!cfg){ showLogin('Konfigurasi Supabase belum diisi di file.'); return; }
  try{
    // Hapus sesi lama yang tersimpan permanen (versi sebelumnya)
    try{ Object.keys(localStorage).filter(k=>k.startsWith('sb-')&&k.endsWith('-auth-token')).forEach(k=>localStorage.removeItem(k)); }catch(e){}
    // Sesi disimpan di sessionStorage: otomatis hilang saat tab/browser ditutup
    sb = supabase.createClient(cfg.url.replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,''), cfg.key, {
      auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
    });
    const { data } = await sb.auth.getSession();
    if(data && data.session) await startApp(data.session.user); else showLogin();
  }catch(err){
    console.error('Supabase error:', err);
    showLogin('Gagal tersambung ke Supabase (lihat console).');
  }
}
const IDLE_LIMIT_MS = 5 * 60 * 1000; // 5 menit
let lastActivity = Date.now(), idleTimer = null, idleWatching = false;
function startIdleWatch(){
  lastActivity = Date.now();
  if(idleWatching) return;
  idleWatching = true;
  const bump = ()=>{ lastActivity = Date.now(); };
  ['mousemove','mousedown','keydown','scroll','touchstart','click'].forEach(ev=>window.addEventListener(ev, bump, { passive:true }));
  idleTimer = setInterval(()=>{ if(Date.now()-lastActivity > IDLE_LIMIT_MS) idleLogout(); }, 10000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && Date.now()-lastActivity > IDLE_LIMIT_MS) idleLogout(); });
}
async function idleLogout(){
  clearInterval(idleTimer);
  try{ sessionStorage.setItem('idle_logout','1'); }catch(e){}
  await doLogout();
}
function showLogin(msg){
  try{
    if(!msg && sessionStorage.getItem('idle_logout')){

    .on('postgres_changes', { event:'*', schema:'public', table:'task_files' }, reloadFromSupabase)

async function loadAll(first){
  const { data, error } = await sb.from('tasks').select('*').order('sort_order', { ascending: true });
  if(error){ console.error(error); setSyncStatus('● Gagal memuat data', 'var(--danger)'); return; }
  tasks = data || [];

  if(canSeeFiles()){
    const { data: fl } = await sb.from('task_files').select('*').order('uploaded_at', { ascending: true });
    taskFiles = {}; (fl||[]).forEach(f=>{ (taskFiles[f.task_id] = taskFiles[f.task_id]||[]).push(f); });
  }
  if(first && tasks.length===0 && canEdit() && SEED.length){
    // Tabel masih kosong: master mengunggah data awal satu kali
    tasks = SEED.map((t,i)=>({ ...t, sort_order:i }));

function handleSyncError(res){

function syncUpsert(task){ if(sb) sb.from('tasks').upsert(toRow(task)).then(handleSyncError); }

function syncReorder(){

}

function daysUntil(d){
  const now = new Date(); now.setHours(0,0,0,0);
  const dl = new Date(d);
  return Math.round((dl-now)/86400000);
}

// Terlambat dihitung dari deadline (bukan status tersimpan), sama seperti kartu & badge
function isLate(t){ return t.status!=="Selesai" && t.status!=="Telah Dikirim" && daysUntil(t.deadline)<0; }
// Kuning: sisa 8-14 hari, Jingga: sisa 0-7 hari (hanya pekerjaan yang masih dikerjakan)
function dlLevel(t){
  if(!['Belum Mulai','Berjalan','Perlu Revisi'].includes(t.status)) return '';
  const d = daysUntil(t.deadline);
  return d<0 ? '' : d<=7 ? 'orange' : d<=14 ? 'yellow' : '';
}
function matchStatus(t, fs){
  if(fs==='Terlambat') return isLate(t);
  if(fs==='Selesai') return t.status==='Selesai';
  return t.status===fs && !isLate(t);
}
function computeBadge(t){
  if(t.status==="Selesai") return {cls:"b-ok", text:"Selesai"};
  if(t.status==="Telah Dikirim") return {cls:"b-info", text:"Telah Dikirim"};
  const du = daysUntil(t.deadline);
  if(du<0) return {cls:"b-danger", text:"Terlambat ("+Math.abs(du)+" hr)"};
  const lv = dlLevel(t), pre = t.status==="Perlu Revisi" ? "Perlu Revisi · " : "";
  if(lv) return {cls:"b-"+lv, text:pre+du+" hr lagi"};
  if(t.status==="Perlu Revisi") return {cls:"b-rev", text:"Perlu Revisi"};
  if(t.status==="Belum Mulai") return {cls:"b-muted", text:"Belum Mulai"};
  return {cls:"b-ok", text:"Berjalan"};
}

function uniqueVals(key){
  return [...new Set(tasks.map(t=>t[key]).filter(Boolean))].sort();
}

function populateFilters(){
  const cat = document.getElementById('fCategory'), reg = document.getElementById('fRegion');
  const catVal = cat.value, regVal = reg.value;
  cat.innerHTML = '<option value="">Semua Kategori</option>' + uniqueVals('category').map(c=>`<option ${c===catVal?'selected':''}>${c}</option>`).join('');
  reg.innerHTML = '<option value="">Semua Wilayah/Unit</option>' + uniqueVals('region').map(r=>`<option ${r===regVal?'selected':''}>${r}</option>`).join('');
}

function render(){
  populateFilters();
  const fc = document.getElementById('fCategory').value;
  const fr = document.getElementById('fRegion').value;
  const fs = document.getElementById('fStatus').value;
  const filtered = tasks.filter(t=>(!fc||t.category===fc)&&(!fr||t.region===fr)&&(!fs||matchStatus(t,fs)));

  const total = tasks.length;
  const done = tasks.filter(t=>t.status==="Selesai").length;
  const late = tasks.filter(isLate).length;
  const soon14 = tasks.filter(t=>dlLevel(t)==='yellow').length;
  const soon7 = tasks.filter(t=>dlLevel(t)==='orange').length;
  const review = tasks.filter(t=>t.status==='Telah Dikirim').length;

  document.getElementById('subtitle').textContent = `${total} pekerjaan • ${uniqueVals('region').length} wilayah/unit • ${uniqueVals('category').length} kategori`;
  document.getElementById('cards').innerHTML = `
    <div class="card"><div class="n">${total}</div><div class="l">Total Pekerjaan</div></div>
    <div class="card"><div class="n" style="color:var(--ok)">${done}</div><div class="l">Selesai</div></div>
    <div class="card"><div class="n" style="color:#60a5fa">${review}</div><div class="l">Menunggu Review</div></div>
    <div class="card"><div class="n" style="color:var(--yellow)">${soon14}</div><div class="l">Sisa 8–14 Hari</div></div>
    <div class="card"><div class="n" style="color:var(--orange)">${soon7}</div><div class="l">Sisa ≤ 7 Hari</div></div>
    <div class="card"><div class="n" style="color:var(--danger)">${late}</div><div class="l">Terlambat</div></div>
  `;

  const groupsEl = document.getElementById('groups');
  if(filtered.length===0){
    groupsEl.innerHTML = '<div class="empty">Tidak ada pekerjaan yang cocok dengan filter.</div>';
    return;
  }
  const byCat = {};
  filtered.forEach(t=>{ (byCat[t.category] = byCat[t.category]||[]).push(t); });
  const catList = syncCategoryOrder(Object.keys(byCat));
  const sortMode = document.getElementById('fSort').value;

  groupsEl.innerHTML = catList.map(cat=>{
    let rowsArr = byCat[cat];
    if(sortMode==='alpha') rowsArr = [...rowsArr].sort((a,b)=>a.region.localeCompare(b.region));
    else if(sortMode==='deadline') rowsArr = [...rowsArr].sort((a,b)=>a.deadline.localeCompare(b.deadline));
    const draggableRow = sortMode==='manual' && canEdit();
    const rows = rowsArr.map(t=>{
      const badge = computeBadge(t);
      return `<tr draggable="${draggableRow}" ondragstart="rowDragStart(event,'${t.id}')" ondragover="event.preventDefault()" ondrop="rowDrop(event,'${t.id}')" ondragend="rowDragEnd(event)">
        <td class="drag-handle col-edit${draggableRow?'':' disabled'}" title="${draggableRow?'Geser untuk urutkan':'Pilih Urutan: Manual dulu untuk drag'}">⠿</td>
        <td>${t.region}</td>
        <td>${t.name}</td>
        <td>${t.pic||'-'}</td>
        <td class="dl-${dlLevel(t)}">${t.deadline}</td>
        <td class="cell-note">${t.notes?esc(t.notes):'-'}${t.review_note?`<div class="note rev">Review: ${esc(t.review_note)}</div>`:''}</td>
        <td class="col-file">${canUpload(t)?`<button class="icon-btn" onclick="openFiles('${t.id}')" title="Lampiran">📎 ${(taskFiles[t.id]||[]).length}</button>`:'<span style="color:var(--muted)">-</span>'}</td>
        <td><span class="badge ${badge.cls}">${badge.text}</span></td>
        <td class="col-edit">
          <button class="icon-btn" onclick="openDuplicate('${t.id}')" title="Duplikat">⧉</button>
          <button class="icon-btn" onclick="openEdit('${t.id}')" title="Edit">✎</button>
          <button class="icon-btn" onclick="removeTask('${t.id}')" title="Hapus">✕</button>
        </td>
      </tr>`;
    }).join('');
    const isCollapsed = collapsedCats.has(cat);
    return `<div class="group"><h2 draggable="${canEdit()}" ondragstart="catDragStart(event,'${cat}')" ondragover="event.preventDefault()" ondrop="catDrop(event,'${cat}')" ondragend="catDragEnd(event)"><span class="drag-handle col-edit" title="Geser untuk urutkan kategori">⠿</span><span class="cat-toggle" onclick="event.stopPropagation();toggleCategory('${cat}')" title="${isCollapsed?'Perluas':'Minimize'}">${isCollapsed?'▸':'▾'}</span>${cat} <span style="color:var(--muted);font-weight:400;font-size:0.8rem;">(${byCat[cat].length} wilayah/unit)</span></h2>
      ${isCollapsed ? '' : `<div class="tbl-scroll"><table>
        <thead><tr><th class="col-edit"></th><th>Wilayah/Unit</th><th>Pekerjaan</th><th>PIC</th><th>Deadline</th><th>Keterangan / Komentar</th><th class="col-file">Lampiran</th><th>Status</th><th class="col-edit"></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`}
    </div>`;
  }).join('');
}

let collapsedCats = new Set((function(){ try{ return JSON.parse(localStorage.getItem('sustainability_collapsed_cats')||'[]'); }catch(e){ return []; } })());
function saveCollapsedCats(){ try{ localStorage.setItem('sustainability_collapsed_cats', JSON.stringify([...collapsedCats])); }catch(e){ /* storage unavailable, ignore */ } }

let categoryOrder = (function(){ try{ return JSON.parse(localStorage.getItem('sustainability_category_order')||'null')||[]; }catch(e){ return []; } })();
function syncCategoryOrder(cats){
  cats.forEach(c=>{ if(!categoryOrder.includes(c)) categoryOrder.push(c); });
  return categoryOrder.filter(c=>cats.includes(c));
}

let draggedTaskId = null;
function rowDragStart(e, id){
  draggedTaskId = id;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  e.currentTarget.classList.add('row-dragging');
}
function rowDragEnd(e){
  e.currentTarget.classList.remove('row-dragging');
  draggedTaskId = null;
}
function rowDrop(e, targetId){
  if(!canEdit()) return;
  e.preventDefault();
  if(!draggedTaskId || draggedTaskId===targetId) return;
  const dragged = tasks.find(t=>t.id===draggedTaskId);
  const target = tasks.find(t=>t.id===targetId);
  if(!dragged || !target || dragged.category!==target.category){ draggedTaskId=null; return; }
  const fromIdx = tasks.findIndex(t=>t.id===draggedTaskId);
  tasks.splice(fromIdx,1);
  const toIdx = tasks.findIndex(t=>t.id===targetId);
  tasks.splice(toIdx,0,dragged);
  draggedTaskId = null;
  syncReorder();
  persist();
}
let draggedCat = null;
function catDragStart(e, cat){
  draggedCat = cat;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', cat);
  e.currentTarget.classList.add('cat-dragging');
}
function catDragEnd(e){
  e.currentTarget.classList.remove('cat-dragging');
  draggedCat = null;
}
function catDrop(e, targetCat){
  if(!canEdit()) return;
  e.preventDefault();
  if(!draggedCat || draggedCat===targetCat) return;
  const fromIdx = categoryOrder.indexOf(draggedCat);
  const toIdx = categoryOrder.indexOf(targetCat);
  categoryOrder.splice(fromIdx,1);
  categoryOrder.splice(toIdx,0,draggedCat);
  pushCategoryOrder();
  draggedCat = null;
  render();
}

function removeTask(id){
  if(!canEdit()) return;
  if(!confirm('Hapus pekerjaan ini?')) return;
  tasks = tasks.filter(t=>t.id!==id);
  syncDelete(id);
  persist();
}
function saveTask(){
  if(!canEdit()) return;
  const name = document.getElementById('fName').value.trim();
  const category = document.getElementById('fCat').value.trim();
  const region = document.getElementById('fReg').value.trim();
  const deadline = document.getElementById('fDeadline').value;
  if(!name||!category||!region||!deadline){ alert('Mohon isi Nama, Kategori, Wilayah, dan Deadline.'); return; }
  const data = {
    name, category, region,
    pic: document.getElementById('fPic').value.trim(),
    deadline,
    status: document.getElementById('fStat').value
  };
  const notes = document.getElementById('fNotes').value.trim();
  const prev = editingId ? tasks.find(t=>t.id===editingId) : null;
  if(notes || (prev && prev.notes!==undefined)) data.notes = notes; // kosongkan hanya jika sebelumnya ada
  if(editingId){
    const idx = tasks.findIndex(t=>t.id===editingId);
    tasks[idx] = {...tasks[idx], ...data};
    syncUpsert(tasks[idx]);
  } else {
    data.id = Date.now().toString();
    data.sort_order = tasks.length;
    tasks.push(data);
    syncUpsert(data);
  }
  closeModal();
  persist();
}

function exportHtml(){
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML.replace(

    `<script id="seed-data" type="application/json">${JSON.stringify(tasks, null, 2)}<\/script>`
  );
  const blob = new Blob([html], {type: 'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'index.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  const { data, error } = await sb.storage.from('lampiran').createSignedUrl(f.path, 60, { download: f.file_name });
  if(error) alert('Gagal membuka file: ' + error.message); else location.href = data.signedUrl;
}
async function delFile(id){
  const f = findFile(id); if(!f || !confirm('Hapus lampiran ini?')) return;
  await sb.storage.from('lampiran').remove([f.path]);

async function sendFiles(){
  const t = tasks.find(x=>x.id===curFileTask); const files = [...$('fmInput').files];
  if(!t || !canUpload(t)) return;
  if(!files.length){ alert('Pilih file terlebih dahulu.'); return; }
  if(files.some(f=>f.size>25*1024*1024)){ alert('Ukuran file maksimal 25 MB.'); return; }
  const btn = $('fmSend'); btn.disabled = true; btn.textContent = 'Mengunggah...';
  try{
    for(const f of files){
      const path = `${t.id}/${Date.now()}_${f.name.replace(/[^\w.\-]+/g,'_')}`;
      let r = await sb.storage.from('lampiran').upload(path, f); if(r.error) throw r.error;
      r = await sb.from('task_files').insert({ task_id:t.id, file_name:f.name, path, uploaded_by:currentEmail }); if(r.error) throw r.error;
    }
    const r = await sb.from('tasks').update({ status:'Telah Dikirim', review_note:null }).eq('id', t.id); if(r.error) throw r.error;
    $('fmInput').value = '';
    await loadAll(false);
  }catch(e){ alert('Gagal mengunggah: ' + (e.message||e)); }
  btn.disabled = false; btn.textContent = 'Kirim untuk Review'; renderFiles();
}
async function reviewTask(ok){
  const t = tasks.find(x=>x.id===curFileTask); if(!t || !isSuper()) return;
  const note = $('fmNote').value.trim();
  if(!ok && !note){ alert('Isi catatan revisi terlebih dahulu.'); return; }
  const r = await sb.from('tasks').update({ status: ok?'Selesai':'Perlu Revisi', review_note: ok?null:note }).eq('id', t.id);
  if(r.error){ alert('Gagal menyimpan: ' + r.error.message); return; }
  $('fmNote').value = ''; await loadAll(false); renderFiles();
}

async function createUser(){
  const username = $('umUser').value.trim().toLowerCase(), password = $('umPass').value, role = $('umRole').value, unit = $('umUnit').value;
  if(!/^[a-z0-9._-]{3,30}$/.test(username)){ alert('Username 3–30 karakter: huruf kecil, angka, titik, strip, atau garis bawah.'); return; }
  if(password.length<8){ alert('Password minimal 8 karakter.'); return; }
  if(role==='admin' && !unit){ alert('Pilih unit untuk Admin.'); return; }
  const btn = $('umCreate'); btn.disabled = true;
  try{ await callUsers({ action:'create', username, password, role, unit: role==='admin'?unit:null }); $('umUser').value=''; $('umPass').value=''; await loadUsers(); alert('Akun berhasil dibuat.'); }
  catch(e){ alert('Gagal membuat akun: ' + e.message); }
  btn.disabled = false;
}
async function resetPw(username){
  const password = prompt('Password baru untuk ' + username + ' (min. 8 karakter):'); if(!password) return;
  try{ await callUsers({ action:'password', username, password }); alert('Password diperbarui.'); }catch(e){ alert('Gagal: ' + e.message); }
}
async function delUser(username){
  if(!confirm('Hapus akun ' + username + '?')) return;
  try{ await callUsers({ action:'delete', username }); await loadUsers(); }catch(e){ alert('Gagal: ' + e.message); }
}
