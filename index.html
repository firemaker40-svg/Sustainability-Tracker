<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pemantau Progres Tim Sustainability</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#f7f8f7; --card:#ffffff; --text:#1c231f; --muted:#647069; --border:#e2e6e3;
  --accent:#2f6b4f; --accent-soft:#e6f0ea; --warn:#b5762b; --warn-soft:#fbeedb;
  --danger:#b0392f; --danger-soft:#f9e4e1; --ok:#2f6b4f; --ok-soft:#e6f0ea;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141815; --card:#1d2320; --text:#e9ece9; --muted:#93a099; --border:#2c3430;
    --accent:#6fbf95; --accent-soft:#1f3329; --warn:#e0a75e; --warn-soft:#3a2c17;
    --danger:#e28578; --danger-soft:#3a201d; --ok:#6fbf95; --ok-soft:#1f3329;
  }
}
:root[data-theme="dark"]{
  --bg:#141815; --card:#1d2320; --text:#e9ece9; --muted:#93a099; --border:#2c3430;
  --accent:#6fbf95; --accent-soft:#1f3329; --warn:#e0a75e; --warn-soft:#3a2c17;
  --danger:#e28578; --danger-soft:#3a201d; --ok:#6fbf95; --ok-soft:#1f3329;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}
h1{font-size:1.4rem;margin:0 0 4px;}
.sub{color:var(--muted);font-size:0.9rem;margin:0 0 20px;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.card .n{font-size:1.5rem;font-weight:700;}
.card .l{color:var(--muted);font-size:0.78rem;}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;}
.sync-status{font-size:0.8rem;color:var(--muted);white-space:nowrap;}
select,input,button,textarea{font-family:inherit;font-size:0.85rem;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);padding:7px 10px;}
button{cursor:pointer;}
.btn-danger{background:var(--danger);color:#fff;border:none;font-weight:600;}
.btn-primary{background:var(--accent);color:#fff;border:none;font-weight:600;}
.spacer{flex:1;}
.group{margin-bottom:18px;}
.group h2{font-size:1rem;margin:0 0 8px;color:var(--accent);}
.tbl-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
table{width:100%;border-collapse:collapse;min-width:640px;background:var(--card);}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);font-size:0.83rem;white-space:nowrap;}
th{color:var(--muted);font-weight:600;font-size:0.75rem;text-transform:uppercase;}
tr:last-child td{border-bottom:none;}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:0.75rem;font-weight:600;}
.b-ok{background:var(--ok-soft);color:var(--ok);}
.b-warn{background:var(--warn-soft);color:var(--warn);}
.b-danger{background:var(--danger-soft);color:var(--danger);}
.b-muted{background:var(--border);color:var(--muted);}
.progress-bar{width:70px;height:6px;background:var(--border);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px;}
.progress-fill{height:100%;background:var(--accent);}
.icon-btn{border:none;background:none;color:var(--muted);cursor:pointer;font-size:0.9rem;padding:2px 4px;}
.icon-btn:hover{color:var(--text);}
.drag-handle{cursor:grab;color:var(--muted);text-align:center;user-select:none;width:24px;}
.drag-handle.disabled{opacity:0.3;cursor:not-allowed;}
tr.row-dragging{opacity:0.35;}
.group h2{cursor:grab;user-select:none;}
.group h2.cat-dragging{opacity:0.4;}
.group h2 .drag-handle{width:auto;margin-right:2px;}
.cat-toggle{display:inline-block;width:14px;text-align:center;cursor:pointer;margin-right:2px;}
.icon-btn:disabled{opacity:0.25;cursor:not-allowed;}
.icon-btn:disabled:hover{color:var(--muted);}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;z-index:10;padding:16px;}
.modal-bg.open{display:flex;}
.modal{background:var(--card);border-radius:12px;padding:20px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;}
.modal h3{margin-top:0;}
.field{margin-bottom:10px;}
.field label{display:block;font-size:0.78rem;color:var(--muted);margin-bottom:4px;}
.field input,.field select{width:100%;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
.empty{text-align:center;color:var(--muted);padding:30px;}
.login-bg{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:340px;}
.login-box h2{margin:0 0 4px;font-size:1.15rem;}
.login-box p{margin:0 0 16px;color:var(--muted);font-size:0.85rem;}
.login-box input{width:100%;margin-bottom:10px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:0.9rem;font-family:inherit;}
.login-box button{width:100%;padding:10px;}
#loginErr{color:var(--danger);font-size:0.82rem;margin-top:10px;min-height:1em;}
body.viewer .col-edit{display:none;}
</style>
</head>
<body>
<div class="login-bg" id="loginScreen">
  <div class="login-box">
    <h2>🌱 Pemantau Progres Tim Sustainability</h2>
    <p>Silakan masuk untuk melanjutkan.</p>
    <input id="loginEmail" type="text" placeholder="Username" autocomplete="username" autocapitalize="none" spellcheck="false">
    <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn-primary" id="loginBtn">Masuk</button>
    <div id="loginErr"></div>
  </div>
</div>
<div class="wrap" id="appWrap" style="display:none">
  <h1>🌱 Pemantau Progres Tim Sustainability</h1>
  <p class="sub" id="subtitle"></p>

  <div class="cards" id="cards">
  </div>

  <div class="toolbar">
    <select id="fCategory"><option value="">Semua Kategori</option></select>
    <select id="fRegion"><option value="">Semua Wilayah/Unit</option></select>
    <select id="fStatus">
      <option value="">Semua Status</option>
      <option value="Belum Mulai">Belum Mulai</option>
      <option value="Berjalan">Berjalan</option>
      <option value="Terlambat">Terlambat</option>
      <option value="Selesai">Selesai</option>
    </select>
    <select id="fSort">
      <option value="manual">Urutan: Manual (drag)</option>
      <option value="alpha">Urutan: Abjad (A-Z)</option>
      <option value="deadline">Urutan: Deadline Terdekat</option>
    </select>
    <div class="spacer"></div>
    <span id="userInfo" class="sync-status"></span>
    <span id="syncStatus" class="sync-status"></span>
    <button id="logoutBtn" class="btn-danger">Sign out</button>
    <button class="btn-primary" id="addBtn">+ Tambah Pekerjaan</button>
  </div>

  <div id="groups"></div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Duplikat Pekerjaan (ubah Kategori &amp; Deadline)</h3>
    <div class="field"><label>Nama Pekerjaan</label><input id="fName" placeholder="mis. Audit Emisi Karbon"></div>
    <div class="field"><label>Kategori</label><input id="fCat" placeholder="mis. Audit Emisi"></div>
    <div class="field"><label>Wilayah / Unit</label><input id="fReg" placeholder="mis. Sumatra - Unit Produksi"></div>
    <div class="field"><label>Penanggung Jawab</label><input id="fPic" placeholder="Nama PIC"></div>
    <div class="field"><label>Deadline</label><input id="fDeadline" type="date"></div>
    <div class="field"><label>Status</label>
      <select id="fStat">
        <option>Belum Mulai</option><option>Berjalan</option><option>Terlambat</option><option>Selesai</option>
      </select>
    </div>
    <div class="field"><label>Progres (%)</label><input id="fProg" type="number" min="0" max="100" value="0"></div>
    <div class="modal-actions">
      <button id="cancelBtn">Batal</button>
      <button class="btn-primary" id="saveBtn">Simpan</button>
    </div>
  </div>
</div>

<script>
const SEED = (function(){ try{ return JSON.parse(document.getElementById('seed-data').textContent); }catch(e){ return []; } })();
let tasks = [];
let userRole = null; // 'master' | 'viewer'
function canEdit(){ return userRole==='master'; }
let editingId = null;
let sb = null; // Supabase client; null = mode lokal saja (localStorage)

// ====== ISI DI SINI AGAR OTOMATIS TERSAMBUNG (tanpa klik tombol Sinkronisasi) ======
const DEFAULT_SB_URL = 'https://axqkwfblcwjifuxeugmf.supabase.co';  // contoh: 'https://abcdefgh.supabase.co'
const DEFAULT_SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4cWt3ZmJsY3dqaWZ1eGV1Z21mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1Mzk2NTcsImV4cCI6MjEwNjExNTY1N30.hcJwIn7Q8jomlXmu1k5Gcdy_LMVgMgpVTpM-vLni4bo';  // contoh: 'eyJhbGciOi...' (anon public key)
// =================================================================================
function getSbConfig(){
  try{
    const c = JSON.parse(localStorage.getItem('sustainability_sb_config')||'null');
    if(c && c.url && c.key) return c;
  }catch(e){}
  if(DEFAULT_SB_URL && DEFAULT_SB_KEY) return { url: DEFAULT_SB_URL, key: DEFAULT_SB_KEY };
  return null;
}
function setSyncStatus(text, color){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  el.textContent = text;
  el.style.color = color || '';
}
function toRow(t){
  return { id:t.id, name:t.name, category:t.category, region:t.region, pic:t.pic||'', deadline:t.deadline, status:t.status, progress:t.progress, sort_order:t.sort_order??0 };
}

const LOGIN_DOMAIN = '@tracker-permata.com';
async function initSupabase(){
  const cfg = getSbConfig();
  if(!cfg){ showLogin('Konfigurasi Supabase belum diisi di file.'); return; }
  try{
    sb = supabase.createClient(cfg.url.replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,''), cfg.key);
    const { data } = await sb.auth.getSession();
    if(data && data.session) await startApp(data.session.user); else showLogin();
  }catch(err){
    console.error('Supabase error:', err);
    showLogin('Gagal tersambung ke Supabase (lihat console).');
  }
}
function showLogin(msg){
  document.getElementById('appWrap').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginErr').textContent = msg || '';
}
async function doLogin(){
  const username = document.getElementById('loginEmail').value.trim().toLowerCase();
  const email = username + LOGIN_DOMAIN; // Supabase Auth butuh format email; dibuat otomatis dari username
  const password = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr'), btn = document.getElementById('loginBtn');
  if(!username || !password){ errEl.textContent = 'Isi username dan password.'; return; }
  btn.disabled = true; errEl.textContent = 'Memproses...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  if(error){ errEl.textContent = 'Username atau password salah.'; return; }
  errEl.textContent = '';
  await startApp(data.user);
}
async function doLogout(){
  try{ if(sb) await sb.auth.signOut(); }catch(e){}
  location.reload();
}
async function startApp(user){
  const { data: roleRows, error: roleErr } = await sb.from('user_roles').select('role').eq('email', (user.email||'').toLowerCase());
  const role = roleRows && roleRows[0] ? roleRows[0].role : null;
  if(roleErr || !role){
    await sb.auth.signOut();
    showLogin('Akun ini belum terdaftar. Hubungi admin.');
    return;
  }
  userRole = role;
  document.body.classList.toggle('viewer', !canEdit());
  document.getElementById('addBtn').style.display = canEdit() ? '' : 'none';
  document.getElementById('userInfo').textContent = 'Logged in as ' + (canEdit() ? 'Master' : 'Viewer');
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appWrap').style.display = '';
  await loadAll(true);
  setSyncStatus('🟢 Tersambung', 'var(--ok)');
  sb.channel('tasks-sync')
    .on('postgres_changes', { event:'*', schema:'public', table:'tasks' }, reloadFromSupabase)
    .on('postgres_changes', { event:'*', schema:'public', table:'app_meta' }, reloadFromSupabase)
    .subscribe();
}
async function loadAll(first){
  const { data, error } = await sb.from('tasks').select('*').order('sort_order', { ascending: true });
  if(error){ console.error(error); setSyncStatus('🔴 Gagal memuat data', 'var(--danger)'); return; }
  tasks = data || [];
  if(first && tasks.length===0 && canEdit() && SEED.length){
    // Tabel masih kosong: master mengunggah data awal satu kali
    tasks = SEED.map((t,i)=>({ ...t, sort_order:i }));
    const { error: e2 } = await sb.from('tasks').upsert(tasks.map(toRow));
    if(e2){ console.error(e2); setSyncStatus('🔴 Gagal unggah data awal', 'var(--danger)'); }
  }
  const { data: metaRows } = await sb.from('app_meta').select('*').eq('key','category_order');
  if(metaRows && metaRows[0]) categoryOrder = metaRows[0].value || [];
  render();
}
async function reloadFromSupabase(){ if(sb && userRole) await loadAll(false); }
function handleSyncError(res){
  if(res && res.error){ console.error(res.error); alert('Gagal menyimpan ke server: ' + res.error.message); reloadFromSupabase(); }
}

function syncUpsert(task){ if(sb) sb.from('tasks').upsert(toRow(task)).then(handleSyncError); }
function syncDelete(id){ if(sb) sb.from('tasks').delete().eq('id', id).then(handleSyncError); }
function syncReorder(){
  tasks.forEach((t,i)=>{ t.sort_order = i; });
  if(sb) sb.from('tasks').upsert(tasks.map(toRow)).then(handleSyncError);
}
async function pushCategoryOrder(){
  saveCategoryOrder();
  if(sb){ const r = await sb.from('app_meta').upsert({ key:'category_order', value: categoryOrder }); handleSyncError(r); }
}

function daysUntil(d){
  const now = new Date(); now.setHours(0,0,0,0);
  const dl = new Date(d);
  return Math.round((dl-now)/86400000);
}

function computeBadge(t){
  if(t.status==="Selesai") return {cls:"b-ok", text:"Selesai"};
  const du = daysUntil(t.deadline);
  if(du<0) return {cls:"b-danger", text:"Terlambat ("+Math.abs(du)+" hr)"};
  if(du<=7) return {cls:"b-warn", text:du+" hr lagi"};
  if(t.status==="Belum Mulai") return {cls:"b-muted", text:"Belum Mulai"};
  return {cls:"b-ok", text:"Berjalan"};
}

function uniqueVals(key){
  return [...new Set(tasks.map(t=>t[key]).filter(Boolean))].sort();
}

function populateFilters(){
  const cat = document.getElementById('fCategory'), reg = document.getElementById('fRegion');
  const catVal = cat.value, regVal = reg.value;
  cat.innerHTML = '<option value="">Semua Kategori</option>' + uniqueVals('category').map(c=>`<option ${c===catVal?'selected':''}>${c}</option>`).join('');
  reg.innerHTML = '<option value="">Semua Wilayah/Unit</option>' + uniqueVals('region').map(r=>`<option ${r===regVal?'selected':''}>${r}</option>`).join('');
}

function render(){
  populateFilters();
  const fc = document.getElementById('fCategory').value;
  const fr = document.getElementById('fRegion').value;
  const fs = document.getElementById('fStatus').value;
  const filtered = tasks.filter(t=>(!fc||t.category===fc)&&(!fr||t.region===fr)&&(!fs||t.status===fs));

  const total = tasks.length;
  const done = tasks.filter(t=>t.status==="Selesai").length;
  const late = tasks.filter(t=>t.status!=="Selesai"&&daysUntil(t.deadline)<0).length;
  const soon = tasks.filter(t=>t.status!=="Selesai"&&daysUntil(t.deadline)>=0&&daysUntil(t.deadline)<=7).length;

  document.getElementById('subtitle').textContent = `${total} pekerjaan • ${uniqueVals('region').length} wilayah/unit • ${uniqueVals('category').length} kategori`;
  document.getElementById('cards').innerHTML = `
    <div class="card"><div class="n">${total}</div><div class="l">Total Pekerjaan</div></div>
    <div class="card"><div class="n" style="color:var(--ok)">${done}</div><div class="l">Selesai</div></div>
    <div class="card"><div class="n" style="color:var(--warn)">${soon}</div><div class="l">Mendekati Deadline</div></div>
    <div class="card"><div class="n" style="color:var(--danger)">${late}</div><div class="l">Terlambat</div></div>
  `;

  const groupsEl = document.getElementById('groups');
  if(filtered.length===0){
    groupsEl.innerHTML = '<div class="empty">Tidak ada pekerjaan yang cocok dengan filter.</div>';
    return;
  }
  const byCat = {};
  filtered.forEach(t=>{ (byCat[t.category] = byCat[t.category]||[]).push(t); });
  const catList = syncCategoryOrder(Object.keys(byCat));
  const sortMode = document.getElementById('fSort').value;

  groupsEl.innerHTML = catList.map(cat=>{
    let rowsArr = byCat[cat];
    if(sortMode==='alpha') rowsArr = [...rowsArr].sort((a,b)=>a.region.localeCompare(b.region));
    else if(sortMode==='deadline') rowsArr = [...rowsArr].sort((a,b)=>a.deadline.localeCompare(b.deadline));
    const draggableRow = sortMode==='manual' && canEdit();
    const rows = rowsArr.map(t=>{
      const badge = computeBadge(t);
      return `<tr draggable="${draggableRow}" ondragstart="rowDragStart(event,'${t.id}')" ondragover="event.preventDefault()" ondrop="rowDrop(event,'${t.id}')" ondragend="rowDragEnd(event)">
        <td class="drag-handle col-edit${draggableRow?'':' disabled'}" title="${draggableRow?'Geser untuk urutkan':'Pilih Urutan: Manual dulu untuk drag'}">⠿</td>
        <td>${t.region}</td>
        <td>${t.name}</td>
        <td>${t.pic||'-'}</td>
        <td>${t.deadline}</td>
        <td><span class="progress-bar"><span class="progress-fill" style="width:${t.progress}%"></span></span>${t.progress}%</td>
        <td><span class="badge ${badge.cls}">${badge.text}</span></td>
        <td class="col-edit">
          <button class="icon-btn" onclick="openDuplicate('${t.id}')" title="Duplikat">📋</button>
          <button class="icon-btn" onclick="openEdit('${t.id}')" title="Edit">✏️</button>
          <button class="icon-btn" onclick="removeTask('${t.id}')" title="Hapus">🗑️</button>
        </td>
      </tr>`;
    }).join('');
    const isCollapsed = collapsedCats.has(cat);
    return `<div class="group"><h2 draggable="${canEdit()}" ondragstart="catDragStart(event,'${cat}')" ondragover="event.preventDefault()" ondrop="catDrop(event,'${cat}')" ondragend="catDragEnd(event)"><span class="drag-handle col-edit" title="Geser untuk urutkan kategori">⠿</span><span class="cat-toggle" onclick="event.stopPropagation();toggleCategory('${cat}')" title="${isCollapsed?'Perluas':'Minimize'}">${isCollapsed?'▸':'▾'}</span>${cat} <span style="color:var(--muted);font-weight:400;font-size:0.8rem;">(${byCat[cat].length} wilayah/unit)</span></h2>
      ${isCollapsed ? '' : `<div class="tbl-scroll"><table>
        <thead><tr><th class="col-edit"></th><th>Wilayah/Unit</th><th>Pekerjaan</th><th>PIC</th><th>Deadline</th><th>Progres</th><th>Status</th><th class="col-edit"></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`}
    </div>`;
  }).join('');
}

async function persist(){
  render();
}

function openAdd(){
  if(!canEdit()) return;
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Tambah Pekerjaan';
  ['fName','fCat','fReg','fPic','fDeadline'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fStat').value = 'Belum Mulai';
  document.getElementById('fProg').value = 0;
  document.getElementById('modalBg').classList.add('open');
}
function openEdit(id){
  if(!canEdit()) return;
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Edit Pekerjaan';
  document.getElementById('fName').value = t.name;
  document.getElementById('fCat').value = t.category;
  document.getElementById('fReg').value = t.region;
  document.getElementById('fPic').value = t.pic||'';
  document.getElementById('fDeadline').value = t.deadline;
  document.getElementById('fStat').value = t.status;
  document.getElementById('fProg').value = t.progress;
  document.getElementById('modalBg').classList.add('open');
}
let collapsedCats = new Set((function(){ try{ return JSON.parse(localStorage.getItem('sustainability_collapsed_cats')||'[]'); }catch(e){ return []; } })());
function saveCollapsedCats(){ try{ localStorage.setItem('sustainability_collapsed_cats', JSON.stringify([...collapsedCats])); }catch(e){ /* storage unavailable, ignore */ } }
function toggleCategory(cat){
  if(collapsedCats.has(cat)) collapsedCats.delete(cat); else collapsedCats.add(cat);
  saveCollapsedCats();
  render();
}
let categoryOrder = (function(){ try{ return JSON.parse(localStorage.getItem('sustainability_category_order')||'null')||[]; }catch(e){ return []; } })();
function syncCategoryOrder(cats){
  cats.forEach(c=>{ if(!categoryOrder.includes(c)) categoryOrder.push(c); });
  return categoryOrder.filter(c=>cats.includes(c));
}
function saveCategoryOrder(){
  try{ localStorage.setItem('sustainability_category_order', JSON.stringify(categoryOrder)); }catch(e){ /* storage unavailable, ignore */ }
}
let draggedTaskId = null;
function rowDragStart(e, id){
  draggedTaskId = id;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  e.currentTarget.classList.add('row-dragging');
}
function rowDragEnd(e){
  e.currentTarget.classList.remove('row-dragging');
  draggedTaskId = null;
}
function rowDrop(e, targetId){
  if(!canEdit()) return;
  e.preventDefault();
  if(!draggedTaskId || draggedTaskId===targetId) return;
  const dragged = tasks.find(t=>t.id===draggedTaskId);
  const target = tasks.find(t=>t.id===targetId);
  if(!dragged || !target || dragged.category!==target.category){ draggedTaskId=null; return; }
  const fromIdx = tasks.findIndex(t=>t.id===draggedTaskId);
  tasks.splice(fromIdx,1);
  const toIdx = tasks.findIndex(t=>t.id===targetId);
  tasks.splice(toIdx,0,dragged);
  draggedTaskId = null;
  syncReorder();
  persist();
}
let draggedCat = null;
function catDragStart(e, cat){
  draggedCat = cat;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', cat);
  e.currentTarget.classList.add('cat-dragging');
}
function catDragEnd(e){
  e.currentTarget.classList.remove('cat-dragging');
  draggedCat = null;
}
function catDrop(e, targetCat){
  if(!canEdit()) return;
  e.preventDefault();
  if(!draggedCat || draggedCat===targetCat) return;
  const fromIdx = categoryOrder.indexOf(draggedCat);
  const toIdx = categoryOrder.indexOf(targetCat);
  categoryOrder.splice(fromIdx,1);
  categoryOrder.splice(toIdx,0,draggedCat);
  pushCategoryOrder();
  draggedCat = null;
  render();
}
function openDuplicate(id){
  if(!canEdit()) return;
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Duplikat Pekerjaan (ubah Kategori & Deadline)';
  document.getElementById('fName').value = t.name;
  document.getElementById('fCat').value = t.category;
  document.getElementById('fReg').value = t.region;
  document.getElementById('fPic').value = t.pic||'';
  document.getElementById('fDeadline').value = t.deadline;
  document.getElementById('fStat').value = 'Belum Mulai';
  document.getElementById('fProg').value = 0;
  document.getElementById('modalBg').classList.add('open');
  setTimeout(()=>{ const f = document.getElementById('fCat'); f.focus(); f.select(); }, 50);
}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
function removeTask(id){
  if(!canEdit()) return;
  if(!confirm('Hapus pekerjaan ini?')) return;
  tasks = tasks.filter(t=>t.id!==id);
  syncDelete(id);
  persist();
}
function saveTask(){
  if(!canEdit()) return;
  const name = document.getElementById('fName').value.trim();
  const category = document.getElementById('fCat').value.trim();
  const region = document.getElementById('fReg').value.trim();
  const deadline = document.getElementById('fDeadline').value;
  if(!name||!category||!region||!deadline){ alert('Mohon isi Nama, Kategori, Wilayah, dan Deadline.'); return; }
  const data = {
    name, category, region,
    pic: document.getElementById('fPic').value.trim(),
    deadline,
    status: document.getElementById('fStat').value,
    progress: Math.max(0,Math.min(100, parseInt(document.getElementById('fProg').value)||0))
  };
  if(editingId){
    const idx = tasks.findIndex(t=>t.id===editingId);
    tasks[idx] = {...tasks[idx], ...data};
    syncUpsert(tasks[idx]);
  } else {
    data.id = Date.now().toString();
    data.sort_order = tasks.length;
    tasks.push(data);
    syncUpsert(data);
  }
  closeModal();
  persist();
}

function exportHtml(){
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML.replace(
    /<script id="seed-data" type="application\/json">[\s\S]*?<\/script>/,
    `<script id="seed-data" type="application/json">${JSON.stringify(tasks, null, 2)}<\/script>`
  );
  const blob = new Blob([html], {type: 'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'index.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
document.getElementById('addBtn').addEventListener('click', openAdd);
document.getElementById('cancelBtn').addEventListener('click', closeModal);
document.getElementById('saveBtn').addEventListener('click', saveTask);
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });
['fCategory','fRegion','fStatus','fSort'].forEach(id=>document.getElementById(id).addEventListener('change', render));


document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('loginEmail').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('logoutBtn').addEventListener('click', doLogout);

initSupabase();
</script>
